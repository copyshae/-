<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello World</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #1a2b24;
        --ink-soft: #3d5248;
        --foam: #f3f7f4;
        --leaf: #2f6b4f;
        --leaf-deep: #1e4a36;
        --sun: #e8c56a;
        --mist: rgba(243, 247, 244, 0.72);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        font-family: Manrope, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(ellipse 80% 60% at 15% 20%, rgba(232, 197, 106, 0.35), transparent 55%),
          radial-gradient(ellipse 70% 50% at 85% 15%, rgba(47, 107, 79, 0.28), transparent 50%),
          radial-gradient(ellipse 90% 70% at 50% 100%, rgba(30, 74, 54, 0.22), transparent 60%),
          linear-gradient(165deg, #dceee4 0%, #b7d4c4 42%, #8fb8a3 100%);
        overflow-x: hidden;
      }

      .atmosphere {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image:
          radial-gradient(circle at 1px 1px, rgba(26, 43, 36, 0.06) 1px, transparent 0);
        background-size: 28px 28px;
        opacity: 0.55;
        animation: drift 28s linear infinite;
      }

      @keyframes drift {
        from {
          background-position: 0 0;
        }
        to {
          background-position: 28px 28px;
        }
      }

      .orb {
        position: fixed;
        border-radius: 50%;
        filter: blur(40px);
        pointer-events: none;
        animation: float 12s ease-in-out infinite;
      }

      .orb-a {
        width: min(42vw, 320px);
        height: min(42vw, 320px);
        background: rgba(232, 197, 106, 0.45);
        top: 8%;
        right: 8%;
        animation-delay: -2s;
      }

      .orb-b {
        width: min(50vw, 380px);
        height: min(50vw, 380px);
        background: rgba(47, 107, 79, 0.35);
        bottom: -8%;
        left: -6%;
        animation-delay: -6s;
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0) scale(1);
        }
        50% {
          transform: translateY(-18px) scale(1.04);
        }
      }

      main {
        position: relative;
        z-index: 1;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: clamp(1.5rem, 4vw, 3rem);
      }

      .hero {
        width: min(100%, 42rem);
        text-align: center;
      }

      .brand {
        font-family: Fraunces, Georgia, serif;
        font-optical-sizing: auto;
        font-weight: 700;
        font-size: clamp(4.5rem, 16vw, 8.5rem);
        line-height: 0.92;
        letter-spacing: -0.04em;
        color: var(--leaf-deep);
        opacity: 0;
        animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.1s forwards;
      }

      .brand span {
        display: block;
        color: var(--leaf);
      }

      h1 {
        margin-top: 1.25rem;
        font-family: Fraunces, Georgia, serif;
        font-weight: 500;
        font-size: clamp(1.35rem, 3.5vw, 1.85rem);
        line-height: 1.25;
        color: var(--ink);
        opacity: 0;
        animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.28s forwards;
      }

      p {
        margin: 1rem auto 0;
        max-width: 28rem;
        font-size: clamp(1rem, 2.2vw, 1.125rem);
        line-height: 1.6;
        color: var(--ink-soft);
        font-weight: 400;
        opacity: 0;
        animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.42s forwards;
      }

      .cta {
        margin-top: 2rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        padding: 0.85rem 1.4rem;
        border: none;
        border-radius: 0.5rem;
        background: var(--leaf-deep);
        color: var(--foam);
        font-family: Manrope, sans-serif;
        font-size: 0.95rem;
        font-weight: 600;
        letter-spacing: 0.01em;
        text-decoration: none;
        cursor: pointer;
        opacity: 0;
        animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.56s forwards;
        transition: background 0.2s ease, transform 0.2s ease;
      }

      .cta:hover {
        background: var(--leaf);
        transform: translateY(-2px);
      }

      .cta:focus-visible {
        outline: 2px solid var(--sun);
        outline-offset: 3px;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(18px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .atmosphere,
        .orb,
        .brand,
        h1,
        p,
        .cta {
          animation: none;
        }

        .brand,
        h1,
        p,
        .cta {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>
    <div class="orb orb-a" aria-hidden="true"></div>
    <div class="orb orb-b" aria-hidden="true"></div>
    <main>
      <section class="hero">
        <p class="brand">Hello<span>World</span></p>
        <h1>A quiet first page on the web.</h1>
        <p>
          Welcome. This is a simple starting point — open it in a browser and
          begin building from here.
        </p>
        <a class="cta" href="#hello" id="hello">Say hello</a>
      </section>
    </main>
  </body>
</html>
