name: 更新太陽盛德曲庫

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安裝 yt-dlp
        run: pip install yt-dlp
      - name: 搜尋並產生 catalog.json
        run: python3 scripts/build-taiyang-catalog.py
      - name: 提交曲庫更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/taiyang-music/catalog.json
          if git diff --staged --quiet; then
            echo "曲庫無變更"
          else
            git commit -m "自動更新太陽盛德導師 YouTube 曲庫"
            git push
          fi
