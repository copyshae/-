name: 鏡射學習日誌到 Pages

on:
  push:
    branches: [main]
    paths:
      - "_export/hello-world/directory/**"
      - "docs/habits-7/**"
      - "docs/daily-14/**"
      - "docs/doc-reader/**"
      - "docs/dizigui-41/**"
      - "docs/taiyang-music/**"
      - "docs/directory/**"
      - ".github/workflows/mirror-learning-log-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 同步鏡射到 docs/directory
        run: |
          set -e
          mkdir -p docs/directory/202608 docs/directory/apps
          rsync -a --delete _export/hello-world/directory/apps/habits-7/ docs/directory/apps/habits-7/
          rsync -a docs/daily-14/ docs/directory/apps/daily-14/
          rsync -a docs/doc-reader/ docs/directory/apps/doc-reader/
          rsync -a --delete docs/dizigui-41/ docs/directory/apps/dizigui-41/
          rsync -a --delete docs/taiyang-music/ docs/directory/apps/taiyang-music/
          for n in 21 22 23 24 25 26 27 28 29; do
            cp -f "_export/hello-world/directory/202608/202608${n}-learning-log.html" docs/directory/202608/ 2>/dev/null || true
          done
          cp -f _export/hello-world/directory/202608/index.html docs/directory/202608/index.html
          cp -f _export/hello-world/directory/index.html docs/directory/index.html
          cp -f _export/hello-world/directory/learning-log.html docs/directory/learning-log.html
          # rewrite hello-world absolute URLs to dash mirror for hosted copies
          find docs/directory -name '*.html' -print0 | xargs -0 sed -i \
            -e 's#https://copyshae.github.io/hello-world/directory/apps/habits-7/#https://copyshae.github.io/-/directory/apps/habits-7/#g' \
            -e 's#https://copyshae.github.io/hello-world/directory/apps/daily-14/#https://copyshae.github.io/-/directory/apps/daily-14/#g' \
            -e 's#https://copyshae.github.io/hello-world/directory/apps/doc-reader/#https://copyshae.github.io/-/directory/apps/doc-reader/#g' \
            -e 's#https://copyshae.github.io/hello-world/directory/apps/dizigui-41/#https://copyshae.github.io/-/directory/apps/dizigui-41/#g' \
            -e 's#https://copyshae.github.io/hello-world/directory/apps/taiyang-music/#https://copyshae.github.io/-/directory/apps/taiyang-music/#g'
          for n in 21 22 23 24 25 26 27 28 29; do
            find docs/directory -name '*.html' -print0 | xargs -0 sed -i \
              -e "s#https://copyshae.github.io/hello-world/directory/202608/202608${n}-learning-log.html#https://copyshae.github.io/-/directory/202608/202608${n}-learning-log.html#g"
          done
      - name: 若有 HELLO_WORLD_TOKEN 則推正式站
        env:
          HELLO_WORLD_TOKEN: ${{ secrets.HELLO_WORLD_TOKEN }}
        run: |
          if [ -z "$HELLO_WORLD_TOKEN" ]; then
            echo "No HELLO_WORLD_TOKEN; skip push to hello-world (mirror on dash Pages is enough for phone)."
            exit 0
          fi
          git clone --depth 1 --branch master "https://x-access-token:${HELLO_WORLD_TOKEN}@github.com/copyshae/hello-world.git" /tmp/hw
          mkdir -p /tmp/hw/directory/apps/habits-7 /tmp/hw/directory/apps/daily-14 /tmp/hw/directory/apps/doc-reader \
            /tmp/hw/directory/apps/dizigui-41 /tmp/hw/directory/apps/taiyang-music /tmp/hw/directory/202608
          rsync -a _export/hello-world/directory/apps/habits-7/ /tmp/hw/directory/apps/habits-7/
          rsync -a docs/daily-14/ /tmp/hw/directory/apps/daily-14/
          rsync -a docs/doc-reader/ /tmp/hw/directory/apps/doc-reader/
          rsync -a --delete docs/dizigui-41/ /tmp/hw/directory/apps/dizigui-41/
          rsync -a --delete docs/taiyang-music/ /tmp/hw/directory/apps/taiyang-music/
          for n in 21 22 23 24 25 26 27 28 29; do
            cp -f "_export/hello-world/directory/202608/202608${n}-learning-log.html" /tmp/hw/directory/202608/ 2>/dev/null || true
          done
          cp -f _export/hello-world/directory/learning-log.html /tmp/hw/directory/learning-log.html
          cp -f _export/hello-world/directory/index.html /tmp/hw/directory/index.html
          cp -f _export/hello-world/directory/202608/index.html /tmp/hw/directory/202608/index.html
          cp -f _export/hello-world/directory/202608/20260820-learning-log.html /tmp/hw/directory/202608/ 2>/dev/null || true
          cd /tmp/hw
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No hello-world changes"
          else
            git commit -m "同步學習日誌 0824–0829 與弟子規／盛德歌曲 KTV（免開電腦）"
            git push origin master
            echo "Pushed hello-world"
          fi
      - name: 提交鏡射變更（若有）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/directory
          if git diff --cached --quiet; then
            echo "mirror already current"
          else
            git commit -m "chore: 鏡射學習日誌 0824–0829 到 docs/directory（Pages）"
            git push
          fi
