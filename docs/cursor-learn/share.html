<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a3348" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Cursor 學習" />
  <link rel="apple-touch-icon" href="icon-180.png" sizes="180x180" />
  <link rel="manifest" href="manifest.json" />
  <title>加入主畫面｜Cursor 學習平台</title>
  <style>
    body { font-family: "PingFang TC", "Noto Sans TC", sans-serif; margin: 0; padding: 2rem 1.2rem; background: #eef5f6; color: #142033; line-height: 1.6; }
    .wrap { max-width: 22rem; margin: 0 auto; text-align: center; }
    h1 { color: #1f6f78; font-size: 1.25rem; }
    p, ol { text-align: left; color: #5a6b7d; font-size: 0.92rem; }
    .icon { width: 5.5rem; height: 5.5rem; border-radius: 1.1rem; margin: 1rem auto 0; }
    a.btn, button.btn {
      display: block; width: 100%; margin-top: 0.75rem; background: #1f6f78; color: #fff;
      text-decoration: none; font-weight: 700; padding: 1rem; border-radius: 0.35rem; border: 0;
      font: inherit; font-size: 1rem; cursor: pointer; box-sizing: border-box;
    }
    button.btn.secondary { background: #fff; color: #1f6f78; border: 1px solid #1f6f78; }
    .url { margin-top: 0.75rem; padding: 0.75rem; background: #fff; font-size: 0.8rem; word-break: break-all; text-align: left; }
    .status { font-size: 0.85rem; color: #1f6f78; min-height: 1.3em; margin-top: 0.5rem; }
    .installed { color: #1f6b4a; font-weight: 700; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Cursor 學習平台<br />加入主畫面</h1>
    <img class="icon" src="icon-192.png" alt="Cursor 學習平台圖示" />
    <p>只收錄<strong>Cursor 相關</strong> YouTube 教學（由淺入深）。英文不好也能用：<strong>放大中文字幕／中英對照／中文人聲</strong>。圖示：<strong>Cursor學習</strong>。</p>
    <p class="installed" id="standaloneMsg" hidden>✓ 已從主畫面開啟</p>
    <div class="url" id="url">https://copyshae.github.io/-/cursor-learn/</div>
    <a class="btn" id="open" href="./index.html">打開 Cursor 學習平台</a>
    <button type="button" class="btn secondary" id="copyUrl">複製網址</button>
    <button type="button" class="btn" id="btnInstall">安裝到主畫面</button>
    <p class="status" id="status"></p>
    <ol>
      <li><strong>iPhone</strong>：Safari 開上方網址 → 分享 →「加入主畫面」</li>
      <li><strong>Android</strong>：Chrome → ⋮ →「加入主畫面」；或按上方安裝按鈕</li>
    </ol>
  </div>
  <script>
    var deferredPrompt = null;
    var u = location.href.replace(/share\.html.*$/, "");
    if (u.indexOf("http") !== 0) u = "https://copyshae.github.io/-/cursor-learn/";
    document.getElementById("url").textContent = u;
    document.getElementById("open").href = u;
    if (window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone) {
      document.getElementById("standaloneMsg").hidden = false;
      document.getElementById("btnInstall").textContent = "已從主畫面開啟";
    }
    document.getElementById("copyUrl").onclick = function () {
      var t = document.getElementById("url").textContent;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(t).then(function () {
          document.getElementById("status").textContent = "已複製，請貼到 Safari／Chrome 再開";
        });
      } else { prompt("長按全選複製：", t); }
    };
    window.addEventListener("beforeinstallprompt", function (e) {
      e.preventDefault(); deferredPrompt = e;
      document.getElementById("status").textContent = "可直接按「安裝到主畫面」";
    });
    document.getElementById("btnInstall").onclick = function () {
      if (window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone) {
        document.getElementById("status").textContent = "你已從主畫面開啟"; return;
      }
      if (deferredPrompt) { deferredPrompt.prompt(); deferredPrompt.userChoice.then(function () { deferredPrompt = null; }); return; }
      var ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      document.getElementById("status").textContent = ios
        ? "請用 Safari 開啟 → 分享 → 加入主畫面"
        : "請用 Chrome 開啟 → 選單 → 加入主畫面";
    };
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js?v=4").catch(function () {});
  </script>
</body>
</html>
