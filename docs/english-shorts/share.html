<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f6e72" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="英文短影音" />
  <link rel="apple-touch-icon" href="icon-180.png" sizes="180x180" />
  <link rel="manifest" href="manifest.json" />
  <title>加入主畫面｜英文短影音學習台</title>
  <style>
    :root { --accent: #0f6e72; --muted: #4a6b68; }
    body { font-family: "PingFang TC", "Noto Sans TC", sans-serif; margin: 0; padding: 2rem 1.2rem; background: #e8f6f4; color: #123536; line-height: 1.6; }
    .wrap { max-width: 22rem; margin: 0 auto; text-align: center; }
    h1 { color: var(--accent); font-size: clamp(1.1rem, 5vw, 1.4rem); line-height: 1.35; }
    p, ol { text-align: left; color: var(--muted); font-size: 0.92rem; }
    .icon { width: 5.5rem; height: 5.5rem; border-radius: 1.1rem; margin: 1rem auto 0; }
    a.btn, button.btn {
      display: block; width: 100%; margin-top: 0.75rem; background: var(--accent); color: #fff;
      text-decoration: none; font-weight: 700; padding: 1rem; border-radius: 0.35rem; border: 0;
      font: inherit; font-size: 1rem; cursor: pointer; box-sizing: border-box;
    }
    button.btn.secondary { background: #fff; color: var(--accent); border: 1px solid var(--accent); }
    .url { margin-top: 0.75rem; padding: 0.75rem; background: #fff; font-size: 0.8rem; word-break: break-all; text-align: left; }
    .status { font-size: 0.85rem; color: var(--accent); min-height: 1.3em; margin-top: 0.5rem; }
    .installed { color: #1f6b4a; font-weight: 700; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>英文短影音學習台<br />加入主畫面</h1>
    <img class="icon" src="icon-192.png" alt="英文短影音學習台圖示" />
    <p>搜尋推薦頻道、貼上 YouTube Shorts／IG Reels 連結，碎片時間跟讀與連播。加入後主畫面圖示名稱：<strong>英文短影音</strong>。</p>
    <p class="installed" id="standaloneMsg" hidden>✓ 已從主畫面開啟</p>
    <div class="url" id="url">https://copyshae.github.io/-/english-shorts/</div>
    <a class="btn" id="open" href="./index.html">打開英文短影音學習台</a>
    <button type="button" class="btn secondary" id="copyUrl">複製網址</button>
    <button type="button" class="btn" id="btnInstall">安裝到主畫面</button>
    <p class="status" id="status"></p>
    <ol>
      <li><strong>iPhone</strong>：用 Safari 開啟上方網址 → 點下方「分享」→「加入主畫面」→ 完成</li>
      <li><strong>Android</strong>：用 Chrome 開啟 → 右上 ⋮ →「加入主畫面」或「安裝應用程式」；若出現上方「安裝到主畫面」按鈕也可直接按</li>
    </ol>
  </div>
  <script>
    var deferredPrompt = null;
    var u = location.href.replace(/share\.html.*$/, "");
    if (u.indexOf("http") !== 0) u = "https://copyshae.github.io/-/english-shorts/";
    document.getElementById("url").textContent = u;
    document.getElementById("open").href = u;
    if (window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone) {
      document.getElementById("standaloneMsg").hidden = false;
      document.getElementById("btnInstall").textContent = "已從主畫面開啟";
    }
    document.getElementById("copyUrl").onclick = function () {
      var t = document.getElementById("url").textContent;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(t).then(function () {
          document.getElementById("status").textContent = "已複製，請貼到 Safari／Chrome 開啟後再加入";
        });
      } else {
        prompt("長按全選複製：", t);
      }
    };
    window.addEventListener("beforeinstallprompt", function (e) {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById("status").textContent = "可直接按「安裝到主畫面」";
    });
    document.getElementById("btnInstall").onclick = function () {
      if (window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone) {
        document.getElementById("status").textContent = "你已從主畫面開啟本 App";
        return;
      }
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(function () { deferredPrompt = null; });
        return;
      }
      var ios = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      document.getElementById("status").textContent = ios
        ? "請用 Safari 開啟本頁，再點下方「分享」→「加入主畫面」"
        : "請用 Chrome 開啟本頁，再從右上選單選「加入主畫面」";
    };
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js?v=8").catch(function () {});
    }
  </script>
</body>
</html>
