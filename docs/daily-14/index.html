<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#c45c26" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="每日14樣功課" />
  <meta name="description" content="超級生命密碼｜每日14樣功課勾選備忘錄。做完一項消失一項，隔日自動重新開始。" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon-192.png" sizes="192x192" type="image/png" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <title>每日14樣功課</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #3a2214;
      --muted: #7a5640;
      --paper: #fff6e6;
      --accent: #c45c26;
      --heart: #d62828;
      --line: rgba(196, 92, 38, 0.22);
      --glow: #ffe8a3;
      --ok: #2f6b3a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      font-family: "Noto Sans TC", "PingFang TC", sans-serif;
      color: var(--ink);
      line-height: 1.55;
      background:
        radial-gradient(ellipse 90% 55% at 50% -10%, rgba(255, 232, 163, 0.95), transparent 60%),
        radial-gradient(circle at 85% 20%, rgba(255, 200, 120, 0.35), transparent 40%),
        radial-gradient(circle at 15% 70%, rgba(255, 180, 90, 0.25), transparent 45%),
        linear-gradient(180deg, #fff9eb 0%, #f7e4c0 48%, #efd2a0 100%);
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    .wrap {
      max-width: 26rem;
      margin: 0 auto;
      padding: 1.15rem 1rem 2.5rem;
    }
    header {
      text-align: center;
      animation: rise 0.55s ease-out both;
    }
    .brand {
      font-family: "Noto Serif TC", "Songti TC", serif;
      font-size: clamp(1.85rem, 8vw, 2.35rem);
      font-weight: 700;
      color: var(--heart);
      letter-spacing: 0.06em;
      text-shadow: 0 1px 0 rgba(255,255,255,0.5);
    }
    .sub {
      margin-top: 0.35rem;
      color: var(--muted);
      font-size: 0.92rem;
    }
    .date-row {
      margin-top: 0.85rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      justify-content: center;
      align-items: center;
    }
    .pill {
      font-size: 0.82rem;
      color: var(--accent);
      background: rgba(255,255,255,0.55);
      border: 1px solid var(--line);
      padding: 0.28rem 0.65rem;
    }
    .progress {
      margin-top: 0.9rem;
      height: 0.45rem;
      background: rgba(255,255,255,0.45);
      border: 1px solid var(--line);
      overflow: hidden;
    }
    .progress > span {
      display: block;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #e07a3a, #c45c26);
      transition: width 0.35s ease;
    }
    .hint {
      margin-top: 0.55rem;
      font-size: 0.82rem;
      color: var(--muted);
      text-align: center;
    }
    .install {
      margin-top: 0.85rem;
      font-size: 0.84rem;
      color: var(--muted);
      border-left: 3px solid var(--accent);
      padding: 0.5rem 0.7rem;
      background: rgba(255,255,255,0.4);
      text-align: left;
      animation: rise 0.6s 0.05s ease-out both;
    }
    .install strong { color: var(--accent); font-weight: 700; }
    ul#list {
      list-style: none;
      margin-top: 1.15rem;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }
    li.task {
      display: grid;
      grid-template-columns: 2.4rem 1fr;
      gap: 0.55rem;
      align-items: start;
      padding: 0.85rem 0.75rem;
      background: rgba(255, 252, 245, 0.78);
      border: 1px solid var(--line);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      animation: rise 0.5s ease-out both;
      transition: transform 0.2s ease, opacity 0.35s ease, max-height 0.4s ease, margin 0.35s ease, padding 0.35s ease, border 0.35s ease;
      max-height: 12rem;
      overflow: hidden;
    }
    li.task:active { transform: scale(0.985); }
    li.task.done {
      opacity: 0;
      max-height: 0;
      margin: 0;
      padding-top: 0;
      padding-bottom: 0;
      border-width: 0;
      pointer-events: none;
    }
    .num {
      width: 2.15rem;
      height: 2.15rem;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #f06a6a, var(--heart) 55%, #9e1515);
      color: #fff;
      font-weight: 700;
      font-size: 0.95rem;
      display: grid;
      place-items: center;
      box-shadow: 0 2px 6px rgba(180, 30, 30, 0.35);
      flex-shrink: 0;
    }
    .body { min-width: 0; }
    .title {
      font-size: 1.02rem;
      font-weight: 700;
      color: var(--ink);
    }
    .note {
      margin-top: 0.2rem;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .check-hint {
      margin-top: 0.35rem;
      font-size: 0.75rem;
      color: var(--accent);
      opacity: 0.85;
    }
    .done-panel {
      display: none;
      margin-top: 1.4rem;
      text-align: center;
      padding: 1.4rem 1rem;
      background: rgba(255,255,255,0.55);
      border: 1px solid var(--line);
      animation: rise 0.55s ease-out both;
    }
    .done-panel.show { display: block; }
    .done-panel h2 {
      font-family: "Noto Serif TC", serif;
      font-size: 1.45rem;
      color: var(--ok);
      font-weight: 700;
    }
    .done-panel p { margin-top: 0.45rem; color: var(--muted); font-size: 0.92rem; }
    .actions {
      margin-top: 1.1rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
    }
    button {
      font: inherit;
      cursor: pointer;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.7);
      color: var(--accent);
      padding: 0.55rem 0.9rem;
      font-weight: 600;
      font-size: 0.9rem;
    }
    button.primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    footer {
      margin-top: 1.8rem;
      text-align: center;
      font-size: 0.78rem;
      color: var(--muted);
      animation: rise 0.7s 0.15s ease-out both;
    }
    footer a { color: var(--accent); }
    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1 class="brand">每日14樣功課</h1>
      <p class="sub">超級生命密碼｜天圓文化</p>
      <div class="date-row">
        <span class="pill" id="todayLabel">—</span>
        <span class="pill" id="countLabel">完成 0／14</span>
      </div>
      <div class="progress" aria-hidden="true"><span id="bar"></span></div>
      <p class="hint">點一下＝完成並消失；明天自動全部回來</p>
    </header>

    <p class="install" id="installTip">
      <strong>加到手機主畫面：</strong>用 Safari／Chrome 開啟本頁 →「分享」或選單 →「加入主畫面」。之後像 App 一樣每天打開勾選。
    </p>

    <ul id="list" aria-label="今日功課清單"></ul>

    <div class="done-panel" id="donePanel">
      <h2>今日功課全部完成</h2>
      <p>明天會自動重新出現 14 項，日復一日。</p>
      <div class="actions">
        <button type="button" id="undoLast" class="primary">撤銷上一項</button>
        <button type="button" id="resetToday">重設今日</button>
      </div>
    </div>

    <div class="actions" id="bottomActions" style="margin-top:1.2rem;">
      <button type="button" id="undoBtn">撤銷上一項</button>
      <button type="button" id="resetBtn">重設今日</button>
    </div>

    <footer>
      <p>資料只存在這支手機瀏覽器（不上傳）。</p>
      <p style="margin-top:0.35rem;"><a href="../">回習作工具主頁</a></p>
    </footer>
  </div>

  <script>
    const TASKS = [
      { id: 1, title: "每天聆聽「富有」歌曲 3 次" },
      { id: 2, title: "每天聆聽「注入彩虹」3 次" },
      { id: 3, title: "每天看蔡禮旭老師講解的弟子規" },
      { id: 4, title: "懺悔發願（心法步驟一二三）" },
      { id: 5, title: "每天寫心得" },
      { id: 6, title: "練習秒秒感恩" },
      { id: 7, title: "做到去我" },
      { id: 8, title: "做太陽心法，每天做 15 分鐘以上" },
      { id: 9, title: "每天照鏡子" },
      { id: 10, title: "秒秒轉念" },
      { id: 11, title: "秒秒參悟空" },
      { id: 12, title: "每天「營造」生活" },
      { id: 13, title: "參加網絡共修課程", note: "每週一項；今日若已參加可勾選" },
      {
        id: 14,
        title: "渡人",
        note: "增添德資糧，與人分享，分發結緣書，接引他人一起來學習《超級生命密碼》"
      }
    ];

    const STORAGE_KEY = "daily14-v1";

    function todayKey() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return { date: todayKey(), done: [], order: [] };
        const data = JSON.parse(raw);
        if (!data || data.date !== todayKey()) {
          return { date: todayKey(), done: [], order: [] };
        }
        return {
          date: data.date,
          done: Array.isArray(data.done) ? data.done.map(Number) : [],
          order: Array.isArray(data.order) ? data.order.map(Number) : []
        };
      } catch {
        return { date: todayKey(), done: [], order: [] };
      }
    }

    function saveState(state) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    let state = loadState();
    const listEl = document.getElementById("list");
    const barEl = document.getElementById("bar");
    const countLabel = document.getElementById("countLabel");
    const todayLabel = document.getElementById("todayLabel");
    const donePanel = document.getElementById("donePanel");
    const bottomActions = document.getElementById("bottomActions");

    function formatToday() {
      const d = new Date();
      const week = ["日", "一", "二", "三", "四", "五", "六"][d.getDay()];
      return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日（${week}）`;
    }

    function remaining() {
      return TASKS.filter((t) => !state.done.includes(t.id));
    }

    function updateMeta() {
      const n = state.done.length;
      const pct = Math.round((n / TASKS.length) * 100);
      barEl.style.width = pct + "%";
      countLabel.textContent = `完成 ${n}／${TASKS.length}`;
      todayLabel.textContent = formatToday();
      const allDone = n >= TASKS.length;
      donePanel.classList.toggle("show", allDone);
      bottomActions.style.display = allDone ? "none" : "flex";
    }

    function render() {
      // midnight rollover while page stays open
      if (state.date !== todayKey()) {
        state = { date: todayKey(), done: [], order: [] };
        saveState(state);
      }
      listEl.innerHTML = "";
      remaining().forEach((task, i) => {
        const li = document.createElement("li");
        li.className = "task";
        li.dataset.id = String(task.id);
        li.style.animationDelay = `${Math.min(i, 8) * 0.04}s`;
        li.setAttribute("role", "button");
        li.tabIndex = 0;
        li.innerHTML =
          `<span class="num" aria-hidden="true">${task.id}</span>` +
          `<span class="body">` +
          `<div class="title">${task.title}</div>` +
          (task.note ? `<div class="note">${task.note}</div>` : "") +
          `<div class="check-hint">點一下完成</div>` +
          `</span>`;
        const finish = () => completeTask(task.id, li);
        li.addEventListener("click", finish);
        li.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            finish();
          }
        });
        listEl.appendChild(li);
      });
      updateMeta();
    }

    function completeTask(id, li) {
      if (state.done.includes(id)) return;
      state.done.push(id);
      state.order.push(id);
      saveState(state);
      if (li) {
        li.classList.add("done");
        setTimeout(() => {
          render();
        }, 320);
      } else {
        render();
      }
    }

    function undoLast() {
      if (!state.order.length) return;
      const id = state.order.pop();
      state.done = state.done.filter((x) => x !== id);
      saveState(state);
      render();
    }

    function resetToday() {
      if (!confirm("確定要重設今日全部勾選嗎？")) return;
      state = { date: todayKey(), done: [], order: [] };
      saveState(state);
      render();
    }

    document.getElementById("undoBtn").addEventListener("click", undoLast);
    document.getElementById("undoLast").addEventListener("click", undoLast);
    document.getElementById("resetBtn").addEventListener("click", resetToday);
    document.getElementById("resetToday").addEventListener("click", resetToday);

    // hide install tip once dismissed via local flag, or after first complete day
    try {
      if (localStorage.getItem("daily14-hide-install") === "1") {
        document.getElementById("installTip").style.display = "none";
      }
    } catch (_) {}

    document.getElementById("installTip").addEventListener("click", () => {
      try { localStorage.setItem("daily14-hide-install", "1"); } catch (_) {}
    });

    // refresh at local midnight
    function scheduleMidnight() {
      const now = new Date();
      const next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 2);
      setTimeout(() => {
        render();
        scheduleMidnight();
      }, Math.max(1000, next - now));
    }

    render();
    scheduleMidnight();

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }
  </script>
</body>
</html>
